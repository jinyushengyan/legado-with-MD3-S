name: Sync Upstream and Build

# 手动触发：把上游 main 合并进 jinyu，然后编译漫画增强版正式包（release / R8）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      upstream: ${{ steps.merge.outputs.upstream }}
    steps:
      - name: Checkout jinyu
        uses: actions/checkout@v5
        with:
          ref: jinyu
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add upstream https://github.com/HapeLee/legado-with-MD3.git
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "已经是最新，无需合并"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            # 有冲突时这里会失败，整个 workflow 停止，需要回本地手工合并
            git merge --no-ff -m "merge: sync upstream $UP" upstream/main
            git push origin HEAD:jinyu
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jinyu
        uses: actions/checkout@v5
        with:
          ref: jinyu

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure compile SDK 37
        run: sdkmanager --install "platforms;android-37" || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secret RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build comic release
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAppComicRelease --console=plain \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-comic-release
          path: app/build/outputs/apk/appComic/release/*.apk
          if-no-files-found: error

      - name: Publish release
        run: |
          set -e
          M=$(grep '^VERSION_MAJOR=' app/version.properties | cut -d= -f2)
          m=$(grep '^VERSION_MINOR=' app/version.properties | cut -d= -f2)
          p=$(grep '^VERSION_PATCH=' app/version.properties | cut -d= -f2)
          VER="${M}.${m}.${p}-jinyu"
          TAG="${VER}.${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          基于上游 ${SYNCED_UPSTREAM} 同步构建（漫画增强版 comic，R8 压缩）。

          包名 io.legato.kazusa.debug，可与官方版共存。
          架构：arm64-v8a / armeabi-v7a / universal，不确定就下 universal。
          EOF
          gh release create "$TAG" \
            app/build/outputs/apk/appComic/release/*.apk \
            --title "阅读·S ${VER}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCED_UPSTREAM: ${{ needs.sync.outputs.upstream }}
