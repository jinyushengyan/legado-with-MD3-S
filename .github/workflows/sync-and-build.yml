name: 同步上游 & 发布 Release

# 触发：手动点 Run workflow，或 push 到 jinyu 分支（日常更新自动跑）
on:
  workflow_dispatch:
  push:
    branches: [jinyu]

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.merge.outputs.upstream }}
      commit_sha: ${{ steps.merge.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: jinyu
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add upstream https://github.com/HapeLee/legado-with-MD3.git
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "已经包含上游 $UP，无需合并"
          else
            echo "合入上游 $UP"
            git merge --no-ff -m "merge: sync upstream $UP" upstream/main
            git push origin HEAD:jinyu
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: jinyu

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "已接受许可，缺失的 platform 由 Gradle 自动下载"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secret RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build comic release
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAppComicRelease --console=plain \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-comic-release
          path: app/build/outputs/apk/appComic/release/*.apk
          if-no-files-found: error

      - name: Publish release
        run: |
          set -e
          M=$(grep '^VERSION_MAJOR=' app/version.properties | cut -d= -f2)
          m=$(grep '^VERSION_MINOR=' app/version.properties | cut -d= -f2)
          p=$(grep '^VERSION_PATCH=' app/version.properties | cut -d= -f2)
          VER="${M}.${m}.${p}-jinyu"
          TAG="${VER}.${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          基于上游 ${SYNCED_UPSTREAM} 同步构建（漫画增强版 comic，R8 压缩）。

          包名 io.legato.kazusa.debug，可与官方版共存。
          架构：arm64-v8a / armeabi-v7a / universal，不确定就下 universal。
          EOF
          gh release create "$TAG" \
            app/build/outputs/apk/appComic/release/*.apk \
            --title "阅读·S ${VER}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCED_UPSTREAM: ${{ needs.sync.outputs.upstream }}
